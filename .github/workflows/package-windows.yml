name: Package Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: package-windows
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer and portable EXE
        run: npm run dist

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Aja-Voice-Agent-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
